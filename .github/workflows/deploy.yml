name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Публикуем в ветку gh-pages (peaceiris). Нужен доступ на запись в репозиторий.
permissions:
  contents: write

# Prod и dev пишут в одну ветку gh-pages — сериализуем, чтобы не было гонки.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (prod, base /<repo>/)
        env:
          # Client ID задаётся секретом репозитория (Settings → Secrets → Actions).
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Адрес мини-бэкенда авторизации (переменная репозитория, необязательно).
          VITE_AUTH_BACKEND_URL: ${{ vars.VITE_AUTH_BACKEND_URL }}
          # Кастомный домен: приложение в корне freemoney.sereshotes.dev
          BASE_PATH: /
          # Канал сборки (влияет на имя PWA и бейдж в приложении).
          VITE_CHANNEL: prod
        run: npm run build

      - name: Publish prod to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep_files: не стираем каталог dev/ при выкладке prod.
          keep_files: true
          # Кастомный домен GitHub Pages (пишет файл CNAME в корень gh-pages).
          cname: freemoney.sereshotes.dev
          commit_message: "deploy prod ${{ github.sha }}"

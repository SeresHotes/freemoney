name: Deploy dev channel (Cloudflare Pages)

# Dev-канал живёт на отдельном поддомене dev.freemoney.sereshotes.dev
# (Cloudflare Pages, проект freemoney-dev) — отдельный origin, поэтому нет
# конфликта service worker с prod. base сборки — корень «/».
#
# Требуется секрет репозитория CLOUDFLARE_API_TOKEN с правами Pages:Edit
# (Settings → Secrets and variables → Actions). account_id — публичный.
# Без секрета можно катить вручную:
#   npm ci && VITE_CHANNEL=dev BASE_PATH=/ VITE_GOOGLE_CLIENT_ID=... \
#     VITE_AUTH_BACKEND_URL=https://auth.sereshotes.dev npm run build
#   npx wrangler pages deploy dist --project-name freemoney-dev --branch main

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (dev, base /)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_AUTH_BACKEND_URL: ${{ vars.VITE_AUTH_BACKEND_URL }}
          BASE_PATH: /
          VITE_CHANNEL: dev
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 98f57f1329b9fed2bb0ab7dabc4599d3
          command: pages deploy dist --project-name freemoney-dev --branch main

name = "freemoney-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Оставляем и workers.dev, и кастомный домен рабочими на время перехода.
workers_dev = true

# Кастомный домен воркера (создаёт DNS-запись и сертификат автоматически).
routes = [
  { pattern = "auth.sereshotes.dev", custom_domain = true },
]

# Публичные переменные. GOOGLE_CLIENT_SECRET задаётся отдельно как secret:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
[vars]
GOOGLE_CLIENT_ID = "359046395945-a6i7m2od5ldi63dtgigu1dobkmobreh8.apps.googleusercontent.com"
# APP_URL — fallback-возврат, если ?return не передан. Основной возврат идёт по ?return.
APP_URL = "https://freemoney.sereshotes.dev/"
# Разрешённые origin (CORS и возврат после логина) — старый и новый домены.
ALLOWED_ORIGIN = "https://sereshotes.github.io,https://freemoney.sereshotes.dev"

# Хранилище сессий (refresh-токены). id подставить после создания:
#   npx wrangler kv namespace create SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "91b50d6098f2418aa5116a3a058c16fa"
